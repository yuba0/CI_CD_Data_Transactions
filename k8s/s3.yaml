apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: { app: s3 }
  ports: [{ port: 8333 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  strategy: { type: Recreate }   # un seul pod à la fois sur le volume
  selector:
    matchLabels: { app: s3 }
  template:
    metadata:
      labels: { app: s3 }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333",
                 "-s3.config=/etc/seaweedfs/s3.json"]
          ports: [{ containerPort: 8333 }]
          readinessProbe:
            httpGet: { path: /status, port: 8333 }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: s3-data }
        - name: config
          secret:
            secretName: pipeline-secrets
            items: [{ key: s3.json, path: s3.json }]
