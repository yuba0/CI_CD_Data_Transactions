# Infra de la pipeline (CI et dev local)
#   docker compose up -d --wait            -> Postgres + S3
#   docker compose --profile dashboard up -d  -> + Metabase (http://localhost:3001)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: transactions
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d transactions"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    # S3 local : SeaweedFS (master + volume + filer + passerelle S3 en un process)
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - ./infra/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  ollama:
    # Petit modèle de langage local (Niveau 3) : extraction depuis du texte brut
    #   docker compose --profile slm up -d --wait ollama
    profiles: ["slm"]
    image: ollama/ollama:0.40.10
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      retries: 30

  metabase:
    profiles: ["dashboard"]
    image: metabase/metabase:v0.56.9
    ports: ["3001:3000"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ollama:
