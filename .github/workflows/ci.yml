name: CI - pipeline data

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      inject_bug:
        description: "Scénario d'échec (Niveau 1.6) : none | generation"
        default: "none"
      fail_insert_times:
        description: "Nb de pannes d'insertion simulées (Niveau 1.7)"
        default: "0"

env:
  DATABASE_URL: postgresql://pipeline:pipeline@localhost:5433/transactions
  S3_ENDPOINT: http://localhost:8333
  S3_ACCESS_KEY: pipeline
  S3_SECRET_KEY: pipeline-secret
  INJECT_BUG: ${{ inputs.inject_bug || 'none' }}
  FAIL_INSERT_TIMES: ${{ inputs.fail_insert_times || '0' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Tests unitaires (fonctions pures)
        run: pytest tests/unit -v

  terraform:
    # Niveau 3 : vérifie l'infra cloud (format + validité) sans compte AWS
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: infra/terraform }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  pipeline:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Installation de Tesseract (OCR)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr

      - name: 1. Démarrage S3 local (SeaweedFS) + PostgreSQL
        run: docker compose up -d --wait s3 postgres

      - name: 2. Génération des CSV + relevé image (OCR)
        run: python -m pipeline generate --out data

      - name: 3. Dépôt des CSV dans le S3
        run: python -m pipeline upload --dir data

      - name: 4. Setup du schéma de la base
        run: python -m pipeline init-db

      - name: 5. Traitement + insertion (lecture depuis le S3)
        run: python -m pipeline process --source s3

      - name: 6. Re-run -> aucun fichier ne doit être retraité
        run: |
          python -m pipeline process --source s3 2>&1 | tee rerun.log
          grep -q "'processed': 0, 'skipped': 4" rerun.log

      - name: 7. Tests d'intégration (contenu de la base, retry, idempotence)
        run: pytest tests/integration -v -o log_cli=true -o log_cli_level=WARNING

      - name: Logs des services en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Export de la base (artefact)
        if: always()
        run: |
          docker compose exec -T postgres pg_dump -U pipeline transactions > dump.sql || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-output
          path: |
            data/
            dump.sql

  slm:
    # Niveau 3 : extraction depuis du texte brut par un petit modèle de langage
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      SLM_MODEL: qwen2.5:1.5b
      REQUIRE_SLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Cache du modèle
        uses: actions/cache@v4
        with:
          path: ~/.ollama-models
          key: ollama-${{ env.SLM_MODEL }}
      - name: Démarrage d'Ollama + téléchargement du modèle
        run: |
          docker run -d --name ollama -p 11434:11434 \
            -v ~/.ollama-models:/root/.ollama ollama/ollama:0.40.10
          for i in $(seq 1 30); do curl -sf localhost:11434/api/tags && break; sleep 2; done
          docker exec ollama ollama pull "$SLM_MODEL"
      - name: Test d'extraction SLM
        run: pytest tests/slm -v -o log_cli=true -o log_cli_level=INFO
