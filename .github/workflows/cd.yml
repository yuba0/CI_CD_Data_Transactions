name: CD - déploiement production

# Se déclenche uniquement quand la CI a réussi sur main
on:
  workflow_run:
    workflows: ["CI - pipeline data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          NAME=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          echo "image=$NAME:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=$NAME:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}

  deploy-kubernetes:
    # Déploie la prod sur un cluster Kubernetes (kind, créé dans le runner)
    # et vérifie qu'elle traite réellement des fichiers.
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci-postgres-password' }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY || 'ci-s3-secret' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Création du cluster Kubernetes (kind)
        uses: helm/kind-action@v1
        with: { cluster_name: prod }
      - name: Récupération de l'image publiée sur GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name prod
      - name: Déploiement + smoke test
        run: ./scripts/deploy_k8s.sh --smoke-test
      - name: État du cluster
        if: always()
        run: kubectl -n pipeline get all,pvc,cronjob

  deploy-vm:
    # Optionnel : activé seulement si la variable de dépôt DEPLOY_VM vaut "true"
    # (Settings > Secrets and variables > Actions > Variables)
    if: vars.DEPLOY_VM == 'true'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    # Secrets à définir dans Settings > Environments > production :
    #   VM_HOST, VM_USER, VM_SSH_KEY, POSTGRES_PASSWORD, S3_SECRET_KEY, GHCR_PAT (read:packages)
    steps:
      - uses: actions/checkout@v4

      - name: Configuration SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Préparation des fichiers de config
        run: |
          mkdir deploy
          cp docker-compose.prod.yml deploy/
          cat > deploy/.env <<EOF
          IMAGE=${{ needs.build-and-push.outputs.image }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          PROCESS_INTERVAL=60
          EOF
          jq --arg s "${{ secrets.S3_SECRET_KEY }}" \
             '.identities[0].credentials[0].secretKey = $s' infra/s3.json > deploy/s3.json

      - name: Déploiement sur la VM
        env:
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        run: |
          ssh "$TARGET" "mkdir -p ~/pipeline"
          scp deploy/.env deploy/s3.json deploy/docker-compose.prod.yml "$TARGET":~/pipeline/
          ssh "$TARGET" bash -s <<'EOF'
            set -e
            cd ~/pipeline
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --wait --remove-orphans
            docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Smoke test
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "cd ~/pipeline && sleep 10 && \
             test \"\$(docker inspect -f '{{.State.Running}}' \$(docker compose -f docker-compose.prod.yml ps -q processor))\" = true && \
             docker compose -f docker-compose.prod.yml logs --tail 20 processor"
